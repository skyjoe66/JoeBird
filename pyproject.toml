[project]
name = "birdart"
version = "0.1.0"
description = "Automatic artwork acquisition for Fugleramme: hear a new species, source and cut its illustration."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birdart"]
