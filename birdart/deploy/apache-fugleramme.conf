# Fronts the Fugleramme frame (Python service on 8080) on port 80, so the
# bird collage is reachable as http://birdnet/ with no port number.
#
# /state and /collage.png are served by birdart-overlay (8081) instead, which
# fetches them from the frame and draws the "Image Search Underway" banner over
# the picture while artwork is being acquired. Everything else - the admin page,
# static assets - still goes straight to the frame. Ordering matters: Apache
# takes the first matching ProxyPass, so the specific paths precede "/".
<VirtualHost *:80>
    ServerName birdnet
    ServerAlias birdnet.local

    ProxyPreserveHost On
    ProxyRequests Off

    # The frame pushes redraws over a websocket; upgrade requests have to be
    # proxied as ws:// before the plain ProxyPass below can claim them.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:8080/$1 [P,L]

    ProxyPass        /state           http://127.0.0.1:8081/state
    ProxyPassReverse /state           http://127.0.0.1:8081/state
    ProxyPass        /collage.png     http://127.0.0.1:8081/collage.png
    ProxyPassReverse /collage.png     http://127.0.0.1:8081/collage.png
    ProxyPass        /birdart/        http://127.0.0.1:8081/birdart/
    ProxyPassReverse /birdart/        http://127.0.0.1:8081/birdart/

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Packing a page of illustrations can outrun the 60s default.
    ProxyTimeout 120

    ErrorLog  ${APACHE_LOG_DIR}/fugleramme-error.log
    CustomLog ${APACHE_LOG_DIR}/fugleramme-access.log combined
</VirtualHost>
