name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    # Upstream's release train; a fork must never cut its own from these commits.
    if: github.repository == 'arnegiacomo/fugleramme' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # history back to the last tag
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      # Run through uv, not the official action: that one is a Docker action whose
      # image has no uv, and `build_command = "uv lock"` needs it. `version` commits,
      # tags, pushes and cuts the GitHub release on its own.
      - run: uv run --with "python-semantic-release>=10,<11" semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
